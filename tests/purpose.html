<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PJ 用途界面验证</title>
<style>
body { --comfy-menu-bg:#252525; --comfy-input-bg:#222; --input-text:#ddd; --border-color:#666;
    background:#191919; color:#ddd; font:14px sans-serif; margin:20px; }
main { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
section { width:440px; max-width:100%; background:#042f2e; padding:12px; border-radius:8px; box-sizing:border-box; }
section:nth-child(2) { background:#0f172a; } section:nth-child(3) { background:#211c50; }
label { display:block; margin:8px 0; } input, select, textarea { background:#222; color:#ddd; border:1px solid #666; }
textarea { width:100%; height:120px; box-sizing:border-box; } input { width:100px; }
button { padding:6px 10px; color:#ddd; background:#333; border:1px solid #666; cursor:pointer; }
h1 { font-size:20px; } h2 { font-size:15px; margin:0 0 10px; }
output { display:block; margin:12px 0; }
</style>
<h1>PJ 用途与分段编辑验证</h1>
<p>独立界面测试，不启动采样。</p>
<button id="connect">切换规划器连接</button><button id="restore">保存并重新载入</button>
<output id="result">就绪</output><main></main>
<script type="module">
window.testApp = {registerExtension(extension) {window.extension = extension;}, graph:{_nodes:[],links:{}}, canvas:{setDirty(){}}};
await import('/extensions/pj/pj_segment_sampler.js');
const definitions = [
 ['PJ_FirstPass_SegmentSampler','PJ 一采',{generation_mode:'22帧接力', repair_action:'原采样方式', run_mode:'全部重新采样(刷新全部缓存)',
 base_seed:42, relay_action:'全部生成', relay_start_segment:2, repair_denoise:.4, repair_steps:6, repair_scheduler:'simple', repair_boundary_tokens:2,
 repair_request_id:0, sync_ref_video:true, boundary_constraints:true, blend_mode:'余弦平滑(推荐)', unload_model_after_sampling:true}],
 ['PJ_SegmentSampler','PJ 二采',{refine_action:'常规精修', run_mode:'全部精修(刷新全部缓存)', keep_original_audio:true,
 target_time_second:2, custom_rerun_segments:'2', repair_boundary_tokens:2, refine_request_id:0, blend_mode:'余弦平滑(推荐)', unload_model_after_sampling:true}],
 ['PJ_SegmentPlanner','PJ 规划器',{fps:24,split_mode:'按秒自动切分',chunk_seconds:15,overlap_seconds:.92,num_segments:3,custom_cuts:'0-15,15-30'}],
 ['PJ_H3SegmentContext','PJ H3 分段条件准备',{prompt:'Shared characters and environment.',segment_prompts:'{}',reference_mode:'素材参考（保持完整）',
 motion_context:true,width:768,height:432,length:1080,audio_mode:'生成新声音'}],
];
const instances = [];
for (const [type, title, values] of definitions) {
 const host=document.createElement('section'); const heading=document.createElement('h2'); heading.textContent=title; host.append(heading);
 const panel=document.createElement('div'); host.append(panel); document.querySelector('main').append(host);
 class Node {
  constructor() {
   this.widgets=Object.entries(values).map(([name,value])=>({name,value,type:typeof value==='string'?'text':'number',options:{}}));
   this.properties={}; this.size=[440,300]; this.inputs=type.includes('Sampler')?[{name:'segment_plan',link:1}]:[];
  }
  addWidget(type,name,value,callback,options) {const w={type,name,value,callback,options};this.widgets.push(w);return w;}
  addDOMWidget(name,type,element,options) {const w={name,type,element,options};this.widgets.push(w);return w;}
  computeSize(){return [440,300];} setSize(){this.setDirtyCanvas();}
  setDirtyCanvas(){
   panel.replaceChildren();
   for (const w of this.widgets) {
    if(w.hidden)continue;
    if(w.element){panel.append(w.element);continue;}
    const label=document.createElement('label');label.textContent=w.label||w.name;panel.append(label);
    if(w.type==='button'){label.textContent='';const b=document.createElement('button');b.textContent=w.label||w.name;b.onclick=()=>w.callback?.();label.append(b);continue;}
    const options=w.options.values || ({relay_action:['全部生成','从指定段重做']}[w.name]);
    const input=document.createElement(options?'select':['prompt','segment_prompts'].includes(w.name)?'textarea':'input');
    if(options) for(const choice of options)input.add(new Option(choice,choice));
    input.value=w.value; input.setAttribute('aria-label',w.label||w.name);
    input.onchange=()=>{w.value=typeof w.value==='number'?Number(input.value):input.value;w.callback?.(w.value);};label.append(input);
   }
  }
 }
 await window.extension.beforeRegisterNodeDef(Node,{name:type}); const node=new Node(); node.onNodeCreated();node.setDirtyCanvas();instances.push(node);
}
document.querySelector('#connect').onclick=()=>{
 for(const node of instances.slice(0,2)){node.inputs[0].link=node.inputs[0].link==null?1:null;node.onConnectionsChange();}
};
document.querySelector('#restore').onclick=()=>{
 for(const node of instances){const widgets=node.widgets.filter(w=>w.serialize!==false);const values=widgets.map(w=>w.value);
 widgets.forEach((w,i)=>w.value=values[i]);node.onConfigure?.();node.setDirtyCanvas();}
 document.querySelector('#result').textContent='已按原生控件顺序重新载入；页签控件未写入采样参数。';
};
</script>
